name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: book_crawler_ci
      REDIS_URI: redis://localhost:6379/0

      CRAWL_URL: https://books.toscrape.com
      SCHEDULER_HOUR: 12
      SCHEDULER_MINUTE: 0
      GENERATE_CHANGE_REPORT: "False"

      API_KEY: test-api-key
      API_KEY_NAME: API-KEY

      LIMITER_FREQUENCY: 100
      LIMITER_TIMING: hour

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MongoDB and Redis
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient
          import redis

          for attempt in range(30):
              try:
                  MongoClient(
                      "mongodb://localhost:27017",
                      serverSelectionTimeoutMS=1000,
                  ).admin.command("ping")

                  redis.Redis.from_url(
                      "redis://localhost:6379/0"
                  ).ping()

                  print("MongoDB and Redis are ready")
                  break

              except Exception as exc:
                  print(f"Waiting for services: {exc}")
                  time.sleep(2)
          else:
              raise RuntimeError(
                  "MongoDB or Redis did not become ready"
              )
          PY

      - name: Run tests
        run: pytest -v